# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: guessing-game

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: python ./hooks/deploy.py
    posix:
      shell: sh
      run: python3 ./hooks/deploy.py
    continueOnError: false
